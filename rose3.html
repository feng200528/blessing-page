<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D玫瑰花</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        camera.position.set(0, 3, 12);
        camera.lookAt(0, 0, 0);

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        
        const light1 = new THREE.DirectionalLight(0xffffff, 1.0);
        light1.position.set(5, 8, 5);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xff8888, 0.4);
        light2.position.set(-5, 3, -3);
        scene.add(light2);

        const pointLight = new THREE.PointLight(0xff6644, 0.8, 20);
        pointLight.position.set(3, 4, 3);
        scene.add(pointLight);

        const rose = new THREE.Group();

        // 创建花瓣 - 使用数学玫瑰曲线
        function createPetalShape(size) {
            const shape = new THREE.Shape();
            const points = 100;
            
            // 使用玫瑰曲线 r = cos(k*theta) 创建花瓣轮廓
            for (let i = 0; i <= points; i++) {
                const theta = (i / points) * Math.PI * 2;
                const r = size * Math.abs(Math.cos(2.5 * theta));
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }
            
            return shape;
        }

        // 创建3D花瓣
        function create3DPetal(width, height, curl) {
            const geom = new THREE.BufferGeometry();
            const segW = 24, segH = 32;
            const vertices = [], uvs = [], indices = [];

            for (let j = 0; j <= segH; j++) {
                const v = j / segH;
                for (let i = 0; i <= segW; i++) {
                    const u = i / segW;

                    // 花瓣轮廓 - 水滴形
                    const w = Math.sin(v * Math.PI) * width * (1 - Math.pow(v * 2 - 1, 6) * 0.5);
                    const x = (u - 0.5) * w * 2;
                    const y = v * height;

                    // 弯曲 - 花瓣向外卷曲
                    const curlZ = -curl * Math.pow(v, 2);
                    // 中间凹陷
                    const dip = -Math.sin(u * Math.PI) * 0.15 * v;
                    // 边缘上翘
                    const edge = Math.pow(Math.abs(u - 0.5) * 2, 3) * curl * 0.5;

                    const z = curlZ + dip + edge;

                    vertices.push(x, y, z);
                    uvs.push(u, v);
                }
            }

            for (let j = 0; j < segH; j++) {
                for (let i = 0; i < segW; i++) {
                    const a = j * (segW + 1) + i;
                    const b = a + 1;
                    const c = (j + 1) * (segW + 1) + i;
                    const d = c + 1;
                    indices.push(a, b, c, b, d, c);
                }
            }

            geom.setIndex(indices);
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geom.computeVertexNormals();

            return geom;
        }

        // 花瓣材质
        function createPetalMaterial(layer, total) {
            const t = layer / total;
            const hue = 0;
            const sat = 0.85 + t * 0.1;
            const light = 0.25 + t * 0.2;
            
            return new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(hue, sat, light),
                roughness: 0.5 + t * 0.2,
                metalness: 0.03,
                side: THREE.DoubleSide
            });
        }

        // 构建玫瑰花
        function buildRose() {
            const layers = 15;
            
            for (let layer = 0; layer < layers; layer++) {
                const t = layer / layers;
                const petalsInLayer = 3 + Math.floor(layer * 2);
                const radius = 0.08 + layer * 0.18;
                const width = 0.3 + layer * 0.08;
                const height = 0.4 + layer * 0.1;
                const curl = 0.2 + layer * 0.08;
                const tilt = 0.2 + layer * 0.05;
                const yOffset = 0.8 - layer * 0.05;

                const mat = createPetalMaterial(layer, layers);

                for (let i = 0; i < petalsInLayer; i++) {
                    const angle = (i / petalsInLayer) * Math.PI * 2 + layer * 0.7;
                    const geom = create3DPetal(width, height, curl);
                    const petal = new THREE.Mesh(geom, mat);

                    petal.position.set(
                        Math.cos(angle) * radius,
                        yOffset,
                        Math.sin(angle) * radius
                    );
                    petal.rotation.y = -angle + Math.PI / 2;
                    petal.rotation.x = -tilt;
                    petal.rotation.z = (Math.random() - 0.5) * 0.03;

                    petal.castShadow = true;
                    rose.add(petal);
                }
            }

            // 花心
            const centerGeom = new THREE.SphereGeometry(0.15, 16, 16);
            const centerMat = new THREE.MeshStandardMaterial({
                color: 0x440000,
                roughness: 0.9
            });
            const center = new THREE.Mesh(centerGeom, centerMat);
            center.position.y = 0.9;
            center.scale.y = 0.5;
            rose.add(center);

            // 花茎
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.03, -2, 0.02),
                new THREE.Vector3(-0.02, -4, -0.01),
                new THREE.Vector3(0, -6, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 40, 0.06, 8, false);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x2d5a2d, roughness: 0.8 });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            stem.castShadow = true;
            rose.add(stem);

            // 叶子
            function addLeaf(x, y, z, size, rot) {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0);
                shape.bezierCurveTo(size * 0.3, size * 0.12, size * 0.6, size * 0.15, size, 0);
                shape.bezierCurveTo(size * 0.6, -size * 0.15, size * 0.3, -size * 0.12, 0, 0);
                const geom = new THREE.ShapeGeometry(shape, 10);
                const mat = new THREE.MeshStandardMaterial({ color: 0x2d6a2d, roughness: 0.7, side: THREE.DoubleSide });
                const leaf = new THREE.Mesh(geom, mat);
                leaf.position.set(x, y, z);
                leaf.rotation.z = rot;
                leaf.castShadow = true;
                rose.add(leaf);
            }

            addLeaf(-0.4, -2.5, 0.08, 0.6, -0.5);
            addLeaf(0.45, -4, -0.1, 0.5, 0.5);
        }

        buildRose();
        rose.position.y = 1;
        scene.add(rose);

        // 动画
        function animate() {
            requestAnimationFrame(animate);
            rose.rotation.y += 0.004;
            rose.position.y = 1 + Math.sin(Date.now() * 0.001) * 0.1;
            
            pointLight.position.x = Math.sin(Date.now() * 0.001) * 3;
            pointLight.position.z = Math.cos(Date.now() * 0.001) * 3;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
