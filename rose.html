<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玫瑰花 - 送给特别的你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1a0505 0%, #0a0000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .message {
            position: fixed;
            bottom: 60px;
            text-align: center;
            z-index: 10;
            color: rgba(255, 180, 180, 0.9);
            font-size: 22px;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.6);
            animation: fadeInUp 2s ease-out 2s both;
            letter-spacing: 3px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            position: fixed;
            top: 40px;
            text-align: center;
            z-index: 10;
            color: rgba(255, 150, 150, 0.7);
            font-size: 16px;
            text-shadow: 0 0 15px rgba(255, 100, 100, 0.4);
            animation: fadeIn 2s ease-out 1s both;
            letter-spacing: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 50, 50, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 4s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        .petal {
            position: fixed;
            width: 25px;
            height: 25px;
            background: radial-gradient(ellipse at 30% 30%, #ff3333 0%, #cc0000 40%, #880000 100%);
            border-radius: 50% 0 50% 50%;
            opacity: 0.85;
            animation: petalFall linear infinite;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-100px) rotate(0deg) translateX(0) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                transform: translateY(0) rotate(60deg) translateX(30px) scale(1);
            }
            50% {
                transform: translateY(50vh) rotate(400deg) translateX(-40px) scale(1.1);
            }
            90% {
                opacity: 0.85;
                transform: translateY(100vh) rotate(700deg) translateX(50px) scale(0.9);
            }
            100% {
                transform: translateY(110vh) rotate(720deg) translateX(60px) scale(0.7);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="glow" style="top: 25%; left: 30%;"></div>

    <div class="title">送给特别的你</div>

    <canvas id="roseCanvas"></canvas>

    <div class="message">你是我心中最美的玫瑰 🌹</div>

    <script>
        const canvas = document.getElementById('roseCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 - 50;
        let time = 0;

        // 绘制单片花瓣 - 水滴形状
        function drawPetal(cx, cy, size, angle, layer, curl) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // 花瓣路径 - 水滴形
            ctx.beginPath();
            ctx.moveTo(0, 0);

            // 右侧曲线
            ctx.bezierCurveTo(
                size * 0.4, -size * 0.2,
                size * 0.6, -size * 0.5,
                size * 0.3, -size * 0.9
            );

            // 顶部
            ctx.bezierCurveTo(
                size * 0.1, -size * 1.0,
                -size * 0.1, -size * 1.0,
                -size * 0.3, -size * 0.9
            );

            // 左侧曲线
            ctx.bezierCurveTo(
                -size * 0.6, -size * 0.5,
                -size * 0.4, -size * 0.2,
                0, 0
            );

            // 渐变 - 红色系
            const gradient = ctx.createRadialGradient(0, -size * 0.4, 0, 0, -size * 0.4, size);
            const lightness = 45 + layer * 3;
            gradient.addColorStop(0, `hsl(0, 100%, ${lightness + 15}%)`);
            gradient.addColorStop(0.4, `hsl(0, 95%, ${lightness}%)`);
            gradient.addColorStop(0.8, `hsl(355, 90%, ${lightness - 10}%)`);
            gradient.addColorStop(1, `hsl(350, 85%, ${lightness - 20}%)`);

            ctx.fillStyle = gradient;
            ctx.fill();

            // 边缘高光
            ctx.strokeStyle = `hsla(0, 100%, ${lightness + 25}%, 0.4)`;
            ctx.lineWidth = 1;
            ctx.stroke();

            // 花瓣纹理
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.1);
            ctx.quadraticCurveTo(size * 0.05, -size * 0.5, 0, -size * 0.85);
            ctx.strokeStyle = `hsla(0, 80%, ${lightness - 15}%, 0.3)`;
            ctx.lineWidth = 0.5;
            ctx.stroke();

            ctx.restore();
        }

        // 绘制花茎
        function drawStem() {
            ctx.save();

            // 主茎
            ctx.strokeStyle = '#2d5a2d';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(centerX, centerY + 120);
            ctx.bezierCurveTo(
                centerX - 3, centerY + 200,
                centerX + 3, centerY + 300,
                centerX, centerY + 400
            );
            ctx.stroke();

            // 叶子
            drawLeaf(centerX - 50, centerY + 220, -0.5, 60);
            drawLeaf(centerX + 55, centerY + 300, 0.5, 55);

            ctx.restore();
        }

        function drawLeaf(x, y, angle, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(
                size * 0.3, -size * 0.4,
                size * 0.7, -size * 0.3,
                size, 0
            );
            ctx.bezierCurveTo(
                size * 0.7, size * 0.3,
                size * 0.3, size * 0.4,
                0, 0
            );

            const gradient = ctx.createLinearGradient(0, 0, size, 0);
            gradient.addColorStop(0, '#1a4a1a');
            gradient.addColorStop(0.5, '#2d6a2d');
            gradient.addColorStop(1, '#1a4a1a');

            ctx.fillStyle = gradient;
            ctx.fill();

            // 叶脉
            ctx.strokeStyle = 'rgba(100, 180, 100, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(size * 0.8, 0);
            ctx.stroke();

            ctx.restore();
        }

        // 绘制完整玫瑰花
        function drawRose() {
            const layers = 6;
            const petalsPerLayer = [3, 5, 7, 9, 11, 13];
            const layerRadius = [15, 30, 50, 75, 100, 130];
            const petalSizes = [25, 35, 45, 55, 65, 75];

            // 从外层到内层绘制
            for (let layer = layers - 1; layer >= 0; layer--) {
                const numPetals = petalsPerLayer[layer];
                const radius = layerRadius[layer];
                const petalSize = petalSizes[layer];

                for (let i = 0; i < numPetals; i++) {
                    const angle = (i / numPetals) * Math.PI * 2 + layer * 0.3;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius * 0.5;

                    // 外层花瓣向下弯曲，内层向上
                    const curl = (layer / layers) * 0.5;
                    const petalAngle = angle + Math.PI / 2 + curl;

                    drawPetal(x, y, petalSize, petalAngle, layer, curl);
                }
            }

            // 花心
            ctx.save();
            const heartGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 20);
            heartGradient.addColorStop(0, '#ff1111');
            heartGradient.addColorStop(0.5, '#cc0000');
            heartGradient.addColorStop(1, '#880000');

            ctx.beginPath();
            ctx.arc(centerX, centerY, 18, 0, Math.PI * 2);
            ctx.fillStyle = heartGradient;
            ctx.fill();

            // 花心高光
            ctx.beginPath();
            ctx.arc(centerX - 5, centerY - 5, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 200, 200, 0.4)';
            ctx.fill();

            ctx.restore();
        }

        // 主动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStem();
            drawRose();

            time++;
            requestAnimationFrame(animate);
        }

        // 创建飘落花瓣
        function createPetals() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 4 + 6) + 's';
                const size = Math.random() * 15 + 20;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                document.body.appendChild(petal);

                setTimeout(() => petal.remove(), 12000);
            }, 350);
        }

        // 启动
        animate();
        createPetals();
    </script>
</body>
</html>
