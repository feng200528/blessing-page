<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D玫瑰花 - 送给特别的你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1a0505 0%, #0a0000 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .message {
            position: fixed;
            bottom: 60px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255, 180, 180, 0.9);
            font-size: 22px;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.6);
            animation: fadeInUp 2s ease-out 2s both;
            letter-spacing: 3px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            position: fixed;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255, 150, 150, 0.7);
            font-size: 16px;
            text-shadow: 0 0 15px rgba(255, 100, 100, 0.4);
            animation: fadeIn 2s ease-out 1s both;
            letter-spacing: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .petal {
            position: fixed;
            width: 25px;
            height: 25px;
            background: radial-gradient(ellipse at 30% 30%, #ff3333 0%, #cc0000 40%, #880000 100%);
            border-radius: 50% 0 50% 50%;
            opacity: 0.85;
            animation: petalFall linear infinite;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-100px) rotate(0deg) translateX(0) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                transform: translateY(0) rotate(60deg) translateX(30px) scale(1);
            }
            50% {
                transform: translateY(50vh) rotate(400deg) translateX(-40px) scale(1.1);
            }
            90% {
                opacity: 0.85;
                transform: translateY(100vh) rotate(700deg) translateX(50px) scale(0.9);
            }
            100% {
                transform: translateY(110vh) rotate(720deg) translateX(60px) scale(0.7);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="title">送给特别的你</div>

    <canvas id="canvas3d"></canvas>

    <div class="message">你是我心中最美的玫瑰 🌹</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 场景设置
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        camera.position.z = 8;
        camera.position.y = 2;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xff6666, 1, 100);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff3333, 0.8, 100);
        pointLight2.position.set(-5, 3, -5);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0xffaaaa, 0.6, 100);
        pointLight3.position.set(0, -5, 5);
        scene.add(pointLight3);

        // 玫瑰花组
        const roseGroup = new THREE.Group();

        // 创建花瓣材质
        const petalMaterial = new THREE.MeshPhongMaterial({
            color: 0xff0000,
            specular: 0x444444,
            shininess: 30,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.95
        });

        // 创建单片花瓣几何体
        function createPetalGeometry(size, curl) {
            const shape = new THREE.Shape();
            const s = size;

            // 水滴形状
            shape.moveTo(0, 0);
            shape.bezierCurveTo(s * 0.4, s * 0.1, s * 0.6, s * 0.4, s * 0.3, s * 0.9);
            shape.bezierCurveTo(s * 0.1, s * 1.0, -s * 0.1, s * 1.0, -s * 0.3, s * 0.9);
            shape.bezierCurveTo(-s * 0.6, s * 0.4, -s * 0.4, s * 0.1, 0, 0);

            const geometry = new THREE.ShapeGeometry(shape, 32);

            // 添加弯曲效果
            const positions = geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const y = positions.getY(i);
                const bendAmount = (y / s) * curl;
                positions.setZ(i, bendAmount * bendAmount * 0.3);
            }

            geometry.computeVertexNormals();
            return geometry;
        }

        // 创建玫瑰花
        function createRose() {
            const layers = 7;
            const petalsPerLayer = [3, 5, 7, 9, 11, 13, 15];
            const layerRadius = [0.3, 0.6, 1.0, 1.5, 2.0, 2.6, 3.2];
            const petalSizes = [0.5, 0.7, 0.9, 1.1, 1.3, 1.5, 1.7];
            const layerHeights = [0.8, 0.6, 0.4, 0.2, 0, -0.2, -0.4];

            for (let layer = 0; layer < layers; layer++) {
                const numPetals = petalsPerLayer[layer];
                const radius = layerRadius[layer];
                const size = petalSizes[layer];
                const height = layerHeights[layer];
                const curl = 0.3 + layer * 0.15;

                for (let i = 0; i < numPetals; i++) {
                    const angle = (i / numPetals) * Math.PI * 2 + layer * 0.4;

                    const petalGeom = createPetalGeometry(size, curl);
                    const petal = new THREE.Mesh(petalGeom, petalMaterial.clone());

                    // 调整颜色深浅
                    const hue = 0;
                    const saturation = 1;
                    const lightness = 0.4 + layer * 0.03;
                    petal.material.color.setHSL(hue, saturation, lightness);

                    petal.position.x = Math.cos(angle) * radius;
                    petal.position.z = Math.sin(angle) * radius;
                    petal.position.y = height;

                    petal.rotation.y = -angle + Math.PI / 2;
                    petal.rotation.x = -0.3 - layer * 0.1;

                    roseGroup.add(petal);
                }
            }

            // 花心
            const centerGeom = new THREE.SphereGeometry(0.4, 32, 32);
            const centerMat = new THREE.MeshPhongMaterial({
                color: 0xcc0000,
                specular: 0x222222,
                shininess: 20
            });
            const center = new THREE.Mesh(centerGeom, centerMat);
            center.position.y = 0.9;
            center.scale.y = 0.6;
            roseGroup.add(center);
        }

        // 创建花茎
        function createStem() {
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0),
                new THREE.Vector3(0.1, -2, 0.1),
                new THREE.Vector3(-0.1, -3.5, -0.1),
                new THREE.Vector3(0, -5, 0)
            ]);

            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.12, 8, false);
            const stemMat = new THREE.MeshPhongMaterial({
                color: 0x2d5a2d,
                specular: 0x111111,
                shininess: 10
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            roseGroup.add(stem);

            // 叶子
            createLeaf(-0.8, -2.5, 0.3, 0.8);
            createLeaf(0.9, -3.5, -0.4, 0.7);
        }

        function createLeaf(x, y, z, size) {
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.bezierCurveTo(size * 0.3, size * 0.2, size * 0.7, size * 0.2, size, 0);
            leafShape.bezierCurveTo(size * 0.7, -size * 0.2, size * 0.3, -size * 0.2, 0, 0);

            const leafGeom = new THREE.ShapeGeometry(leafShape, 16);
            const leafMat = new THREE.MeshPhongMaterial({
                color: 0x2d6a2d,
                specular: 0x111111,
                shininess: 10,
                side: THREE.DoubleSide
            });
            const leaf = new THREE.Mesh(leafGeom, leafMat);
            leaf.position.set(x, y, z);
            leaf.rotation.z = x > 0 ? -0.5 : 0.5;
            leaf.rotation.y = x > 0 ? 0.3 : -0.3;
            roseGroup.add(leaf);
        }

        // 构建玫瑰花
        createRose();
        createStem();

        roseGroup.position.y = 1;
        scene.add(roseGroup);

        // 动画
        let rotationSpeed = 0.005;
        function animate() {
            requestAnimationFrame(animate);

            roseGroup.rotation.y += rotationSpeed;

            // 轻微上下浮动
            roseGroup.position.y = 1 + Math.sin(Date.now() * 0.001) * 0.1;

            renderer.render(scene, camera);
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 创建飘落花瓣
        function createPetals() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 4 + 6) + 's';
                const size = Math.random() * 15 + 20;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                document.body.appendChild(petal);

                setTimeout(() => petal.remove(), 12000);
            }, 400);
        }

        // 启动
        animate();
        createPetals();
    </script>
</body>
</html>
