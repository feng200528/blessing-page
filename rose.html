<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D玫瑰花 - 送给特别的你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1a0505 0%, #0a0000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .message {
            position: fixed;
            bottom: 60px;
            text-align: center;
            z-index: 10;
            color: rgba(255, 180, 180, 0.9);
            font-size: 22px;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.6);
            animation: fadeInUp 2s ease-out 2s both;
            letter-spacing: 3px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            position: fixed;
            top: 40px;
            text-align: center;
            z-index: 10;
            color: rgba(255, 150, 150, 0.7);
            font-size: 16px;
            text-shadow: 0 0 15px rgba(255, 100, 100, 0.4);
            animation: fadeIn 2s ease-out 1s both;
            letter-spacing: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 光晕 */
        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 50, 50, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 4s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        /* 飘落花瓣 */
        .petal {
            position: fixed;
            width: 15px;
            height: 15px;
            background: radial-gradient(ellipse at center, #ff4444 0%, #cc0000 100%);
            border-radius: 50% 0 50% 50%;
            opacity: 0.6;
            animation: petalFall linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-100px) rotate(0deg) translateX(0);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(110vh) rotate(720deg) translateX(80px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="glow" style="top: 30%; left: 35%;"></div>

    <div class="title">送给特别的你</div>

    <canvas id="roseCanvas"></canvas>

    <div class="message">你是我心中最美的玫瑰 🌹</div>

    <script>
        const canvas = document.getElementById('roseCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        let rotation = 0;

        // 3D点旋转
        function rotateX(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x,
                y: point.y * cos - point.z * sin,
                z: point.y * sin + point.z * cos
            };
        }

        function rotateY(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos + point.z * sin,
                y: point.y,
                z: -point.x * sin + point.z * cos
            };
        }

        // 投影到2D
        function project(point) {
            const fov = 500;
            const scale = fov / (fov + point.z);
            return {
                x: centerX + point.x * scale,
                y: centerY + point.y * scale,
                scale: scale
            };
        }

        // 生成玫瑰花点
        function generateRosePoints() {
            const points = [];
            const layers = 20;

            for (let layer = 0; layer < layers; layer++) {
                const layerRadius = 20 + layer * 8;
                const petalsInLayer = 8 + layer * 2;
                const heightOffset = layer * 3 - 30;

                for (let i = 0; i < petalsInLayer; i++) {
                    const angle = (i / petalsInLayer) * Math.PI * 2;
                    const petalLength = 30 + layer * 2;

                    // 花瓣形状
                    for (let t = 0; t <= 1; t += 0.1) {
                        const r = layerRadius * (1 - t * 0.3);
                        const x = Math.cos(angle) * r + Math.cos(angle + t * 2) * petalLength * t;
                        const y = heightOffset - t * 20;
                        const z = Math.sin(angle) * r + Math.sin(angle + t * 2) * petalLength * t;

                        points.push({
                            x: x,
                            y: y,
                            z: z,
                            layer: layer,
                            t: t
                        });
                    }
                }
            }

            return points;
        }

        // 绘制花瓣
        function drawPetal3D(x, y, size, layer, t) {
            const alpha = 0.4 + t * 0.6;
            const hue = 0;
            const saturation = 80 - layer * 2;
            const lightness = 30 + layer * 2 + t * 10;

            ctx.save();
            ctx.globalAlpha = alpha;

            // 花瓣形状
            ctx.beginPath();
            ctx.ellipse(x, y, size * 1.5, size, 0, 0, Math.PI * 2);

            const gradient = ctx.createRadialGradient(x, y, 0, x, y, size * 1.5);
            gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness + 20}%, ${alpha})`);
            gradient.addColorStop(0.5, `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`);
            gradient.addColorStop(1, `hsla(${hue}, ${saturation - 20}%, ${lightness - 10}%, ${alpha * 0.5})`);

            ctx.fillStyle = gradient;
            ctx.fill();

            // 边缘高光
            ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness + 30}%, ${alpha * 0.5})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();

            ctx.restore();
        }

        // 绘制花茎
        function drawStem() {
            ctx.save();
            ctx.strokeStyle = '#2d5a2d';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(centerX, centerY + 80);
            ctx.bezierCurveTo(
                centerX - 5, centerY + 180,
                centerX + 5, centerY + 280,
                centerX, centerY + 380
            );
            ctx.stroke();

            // 叶子
            drawLeaf3D(centerX - 40, centerY + 200, -0.4, 50);
            drawLeaf3D(centerX + 45, centerY + 280, 0.4, 45);

            ctx.restore();
        }

        function drawLeaf3D(x, y, angle, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(
                size * 0.3, -size * 0.4,
                size * 0.7, -size * 0.3,
                size, 0
            );
            ctx.bezierCurveTo(
                size * 0.7, size * 0.3,
                size * 0.3, size * 0.4,
                0, 0
            );

            const gradient = ctx.createLinearGradient(0, 0, size, 0);
            gradient.addColorStop(0, '#1a4a1a');
            gradient.addColorStop(0.5, '#2d6a2d');
            gradient.addColorStop(1, '#1a4a1a');

            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.restore();
        }

        // 主绘制函数
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制花茎
            drawStem();

            // 生成并绘制玫瑰花
            const points = generateRosePoints();

            // 按深度排序
            const projectedPoints = points.map(p => {
                let rotated = rotateY(p, rotation);
                rotated = rotateX(rotated, 0.3);
                const projected = project(rotated);
                return {
                    ...projected,
                    layer: p.layer,
                    t: p.t,
                    z: rotated.z
                };
            });

            projectedPoints.sort((a, b) => b.z - a.z);

            // 绘制花瓣
            projectedPoints.forEach(p => {
                const size = 8 * p.scale;
                drawPetal3D(p.x, p.y, size, p.layer, p.t);
            });

            // 花心
            ctx.save();
            const heartGradient = ctx.createRadialGradient(centerX, centerY - 30, 0, centerX, centerY - 30, 25);
            heartGradient.addColorStop(0, '#8b0000');
            heartGradient.addColorStop(0.5, '#a52a2a');
            heartGradient.addColorStop(1, '#cd5c5c');

            ctx.beginPath();
            ctx.arc(centerX, centerY - 30, 20, 0, Math.PI * 2);
            ctx.fillStyle = heartGradient;
            ctx.fill();
            ctx.restore();

            rotation += 0.008;
            requestAnimationFrame(draw);
        }

        // 创建飘落花瓣
        function createPetals() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 5 + 8) + 's';
                const size = Math.random() * 10 + 10;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                document.body.appendChild(petal);

                setTimeout(() => petal.remove(), 15000);
            }, 600);
        }

        // 启动
        draw();
        createPetals();
    </script>
</body>
</html>
