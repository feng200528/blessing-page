<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D玫瑰花 - 送给特别的你</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #canvas3d {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .message {
            position: fixed;
            bottom: 60px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255, 180, 180, 0.9);
            font-size: 22px;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.6);
            animation: fadeInUp 2s ease-out 2s both;
            letter-spacing: 3px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .title {
            position: fixed;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255, 150, 150, 0.7);
            font-size: 16px;
            text-shadow: 0 0 15px rgba(255, 100, 100, 0.4);
            animation: fadeIn 2s ease-out 1s both;
            letter-spacing: 8px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .petal {
            position: fixed;
            width: 25px; height: 25px;
            background: radial-gradient(ellipse at 30% 30%, #ff3333 0%, #cc0000 40%, #880000 100%);
            border-radius: 50% 0 50% 50%;
            opacity: 0.85;
            animation: petalFall linear infinite;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        @keyframes petalFall {
            0% { transform: translateY(-100px) rotate(0deg) translateX(0) scale(0.8); opacity: 0; }
            10% { opacity: 0.9; transform: translateY(0) rotate(60deg) translateX(30px) scale(1); }
            50% { transform: translateY(50vh) rotate(400deg) translateX(-40px) scale(1.1); }
            90% { opacity: 0.85; transform: translateY(100vh) rotate(700deg) translateX(50px) scale(0.9); }
            100% { transform: translateY(110vh) rotate(720deg) translateX(60px) scale(0.7); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="title">送给特别的你</div>
    <canvas id="canvas3d"></canvas>
    <div class="message">你是我心中最美的玫瑰 🌹</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        camera.position.set(0, 2, 8);
        camera.lookAt(0, 0.5, 0);

        // 灯光设置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(3, 5, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xff6666, 0.4);
        fillLight.position.set(-3, 2, -2);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xff3333, 0.6);
        rimLight.position.set(0, -1, -3);
        scene.add(rimLight);

        const pointLight = new THREE.PointLight(0xff4444, 0.8, 15);
        pointLight.position.set(2, 3, 2);
        scene.add(pointLight);

        const roseGroup = new THREE.Group();

        // 创建花瓣几何体 - 使用参数化曲面
        function createPetalGeometry(width, height, curlAmount, bendAmount) {
            const widthSegments = 16;
            const heightSegments = 24;
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const normals = [];
            const uvs = [];
            const indices = [];

            for (let j = 0; j <= heightSegments; j++) {
                const v = j / heightSegments;
                for (let i = 0; i <= widthSegments; i++) {
                    const u = i / widthSegments;

                    // 花瓣轮廓 - 心形/水滴形
                    const profileWidth = Math.sin(v * Math.PI) * width * (1 - Math.pow(v * 2 - 1, 4) * 0.3);
                    
                    // X位置 - 左右展开
                    const x = (u - 0.5) * profileWidth * 2;
                    
                    // Y位置 - 高度
                    const y = v * height;
                    
                    // Z位置 - 弯曲效果
                    // 花瓣向外卷曲
                    const curl = curlAmount * Math.pow(v, 1.5);
                    // 花瓣中间凹陷
                    const dip = -Math.sin(u * Math.PI) * bendAmount * Math.pow(v, 2);
                    // 边缘微微上翘
                    const edgeCurl = Math.pow(Math.abs(u - 0.5) * 2, 3) * curlAmount * 0.3;
                    
                    const z = -curl + dip + edgeCurl;

                    vertices.push(x, y, z);
                    uvs.push(u, v);
                }
            }

            // 生成索引
            for (let j = 0; j < heightSegments; j++) {
                for (let i = 0; i < widthSegments; i++) {
                    const a = j * (widthSegments + 1) + i;
                    const b = a + 1;
                    const c = (j + 1) * (widthSegments + 1) + i;
                    const d = c + 1;
                    indices.push(a, b, c);
                    indices.push(b, d, c);
                }
            }

            geometry.setIndex(indices);
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geometry.computeVertexNormals();

            return geometry;
        }

        // 花瓣材质
        function createPetalMaterial(layer, totalLayers) {
            // 从内到外，颜色从深到浅
            const t = layer / totalLayers;
            const hue = 0;
            const saturation = 0.85 + t * 0.1;
            const lightness = 0.25 + t * 0.15;
            const color = new THREE.Color().setHSL(hue, saturation, lightness);

            return new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.5 + t * 0.2,
                metalness: 0.02,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.98
            });
        }

        // 创建玫瑰花 - 螺旋排列
        function createRose() {
            const totalLayers = 10;
            
            // 花瓣配置 - 从内到外
            const layers = [];
            for (let i = 0; i < totalLayers; i++) {
                const t = i / totalLayers;
                layers.push({
                    petals: 3 + Math.floor(i * 1.5),
                    radius: 0.15 + i * 0.25,
                    width: 0.4 + i * 0.12,
                    height: 0.6 + i * 0.15,
                    heightOffset: 1.2 - i * 0.12,
                    curl: 0.3 + i * 0.12,
                    bend: 0.1 + i * 0.05,
                    tiltAngle: 0.3 + i * 0.08
                });
            }

            // 创建花瓣
            for (let layerIdx = 0; layerIdx < layers.length; layerIdx++) {
                const layer = layers[layerIdx];
                const material = createPetalMaterial(layerIdx, totalLayers);

                for (let i = 0; i < layer.petals; i++) {
                    const angle = (i / layer.petals) * Math.PI * 2 + layerIdx * 0.618 * Math.PI;

                    const petalGeom = createPetalGeometry(layer.width, layer.height, layer.curl, layer.bend);
                    const petal = new THREE.Mesh(petalGeom, material);

                    // 位置
                    petal.position.x = Math.cos(angle) * layer.radius;
                    petal.position.z = Math.sin(angle) * layer.radius;
                    petal.position.y = layer.heightOffset;

                    // 旋转 - 朝向中心
                    petal.rotation.y = -angle + Math.PI / 2;
                    petal.rotation.x = -layer.tiltAngle;
                    
                    // 轻微随机旋转增加自然感
                    petal.rotation.z = (Math.random() - 0.5) * 0.05;

                    petal.castShadow = true;
                    petal.receiveShadow = true;

                    roseGroup.add(petal);
                }
            }

            // 花心 - 紧密包裹的小花瓣
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const innerGeom = createPetalGeometry(0.25, 0.4, 0.8, 0.2);
                const innerMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0, 0.9, 0.2),
                    roughness: 0.6,
                    metalness: 0.02,
                    side: THREE.DoubleSide
                });
                const innerPetal = new THREE.Mesh(innerGeom, innerMat);
                innerPetal.position.set(Math.cos(angle) * 0.1, 1.3, Math.sin(angle) * 0.1);
                innerPetal.rotation.y = -angle;
                innerPetal.rotation.x = -0.8;
                roseGroup.add(innerPetal);
            }

            // 花蕊中心
            const centerGeom = new THREE.SphereGeometry(0.15, 16, 16);
            const centerMat = new THREE.MeshStandardMaterial({
                color: 0x660000,
                roughness: 0.8
            });
            const center = new THREE.Mesh(centerGeom, centerMat);
            center.position.y = 1.35;
            center.scale.y = 0.6;
            roseGroup.add(center);
        }

        // 创建花茎
        function createStem() {
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.05, -1.5, 0.03),
                new THREE.Vector3(-0.03, -3, -0.02),
                new THREE.Vector3(0.02, -4.5, 0.01),
                new THREE.Vector3(0, -6, 0)
            ]);

            const stemGeom = new THREE.TubeGeometry(stemCurve, 64, 0.08, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x2d5a2d,
                roughness: 0.8,
                metalness: 0.05
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            stem.castShadow = true;
            roseGroup.add(stem);

            // 刺
            for (let i = 0; i < 4; i++) {
                const t = 0.2 + i * 0.2;
                const pos = stemCurve.getPoint(t);
                const thornGeom = new THREE.ConeGeometry(0.025, 0.12, 6);
                const thornMat = new THREE.MeshStandardMaterial({ color: 0x3d6a3d, roughness: 0.7 });
                const thorn = new THREE.Mesh(thornGeom, thornMat);
                thorn.position.copy(pos);
                thorn.position.x += (i % 2 === 0 ? 0.08 : -0.08);
                thorn.rotation.z = (i % 2 === 0 ? -1 : 1) * 0.8;
                roseGroup.add(thorn);
            }

            // 叶子
            createLeaf(-0.5, -2.2, 0.15, 0.8, -0.5);
            createLeaf(0.6, -3.5, -0.2, 0.7, 0.5);
        }

        function createLeaf(x, y, z, size, rotZ) {
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.bezierCurveTo(size * 0.25, size * 0.15, size * 0.6, size * 0.18, size, 0);
            leafShape.bezierCurveTo(size * 0.6, -size * 0.18, size * 0.25, -size * 0.15, 0, 0);

            const leafGeom = new THREE.ShapeGeometry(leafShape, 16);
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0x2d6a2d,
                roughness: 0.7,
                metalness: 0.05,
                side: THREE.DoubleSide
            });
            const leaf = new THREE.Mesh(leafGeom, leafMat);
            leaf.position.set(x, y, z);
            leaf.rotation.z = rotZ;
            leaf.rotation.y = x > 0 ? 0.3 : -0.3;
            leaf.castShadow = true;
            roseGroup.add(leaf);
        }

        createRose();
        createStem();

        roseGroup.position.y = 0.5;
        scene.add(roseGroup);

        // 动画
        function animate() {
            requestAnimationFrame(animate);

            roseGroup.rotation.y += 0.004;
            roseGroup.position.y = 0.5 + Math.sin(Date.now() * 0.001) * 0.1;

            pointLight.position.x = Math.sin(Date.now() * 0.0008) * 3;
            pointLight.position.z = Math.cos(Date.now() * 0.0008) * 3;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function createPetals() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 4 + 6) + 's';
                const size = Math.random() * 15 + 20;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 12000);
            }, 500);
        }

        animate();
        createPetals();
    </script>
</body>
</html>
