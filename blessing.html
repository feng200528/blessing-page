<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致朋友的感谢与鼓励</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #533483 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* 背景光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(240, 147, 251, 0.1) 0%, transparent 50%);
            animation: bgShift 15s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-2%, 1%) scale(1.02); }
            66% { transform: translate(1%, -1%) scale(0.98); }
        }

        /* 粒子背景 */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .particle-glow {
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            animation: particleFloat 8s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
            50% { transform: translateY(-10px) translateX(-5px); opacity: 0.5; }
            75% { transform: translateY(-30px) translateX(15px); opacity: 0.9; }
        }

        /* 飘浮的气球 */
        .balloon {
            position: fixed;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: balloonFloat 8s ease-in-out infinite;
            opacity: 0.6;
            z-index: 2;
            filter: blur(0.5px);
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 1.5px;
            height: 35px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
        }

        .balloon::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 25%;
            width: 12px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        @keyframes balloonFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            25% { transform: translateY(-25px) rotate(3deg); }
            50% { transform: translateY(-15px) rotate(-1deg); }
            75% { transform: translateY(-35px) rotate(2deg); }
        }

        /* 星星 */
        .star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            z-index: 1;
        }

        .star::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 7px;
            height: 7px;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            border-radius: 50%;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.8); }
        }

        /* 主要内容卡片 - 毛玻璃效果 */
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 60px 45px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 顶部装饰 */
        .decoration {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .decoration span {
            font-size: 36px;
            animation: decoFloat 3s ease-in-out infinite;
            display: inline-block;
        }

        .decoration span:nth-child(2) { animation-delay: 0.3s; }
        .decoration span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes decoFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.1); }
        }

        .title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #f0c4ff 50%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 2px;
            animation: titleGlow 4s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            margin: 0 auto 40px;
        }

        .message {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 2.2;
            margin: 20px 0;
            animation: fadeInUp 1.5s ease-out;
            font-weight: 300;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message p {
            margin-bottom: 16px;
            position: relative;
        }

        .highlight {
            background: linear-gradient(135deg, #ff6b9d, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 20px;
            position: relative;
        }

        .highlight::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #ff6b9d, #f093fb);
            border-radius: 2px;
            animation: lineGrow 2s ease-out;
        }

        @keyframes lineGrow {
            from { width: 0; }
            to { width: 100%; }
        }

        .encourage {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd93d, #ff6b9d, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 40px !important;
            animation: encourageGlow 3s ease-in-out infinite;
        }

        @keyframes encourageGlow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 5px rgba(255,107,157,0.3)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 15px rgba(255,107,157,0.5)); }
        }

        .belief {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 15px !important;
            font-style: italic;
        }

        /* 按钮 */
        .button {
            background: linear-gradient(135deg, #ff6b9d 0%, #f093fb 50%, #667eea 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 40px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.3);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5);
        }

        .button:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* 彩带 */
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            animation: confettiFall 5s linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        .confetti-round {
            border-radius: 50%;
        }

        .confetti-square {
            border-radius: 2px;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 音乐按钮 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-control:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        .music-control.playing {
            animation: musicPulse 1.5s ease-in-out infinite;
            border-color: rgba(255, 107, 157, 0.5);
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
        }

        @keyframes musicPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 107, 157, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 107, 157, 0.5); }
        }

        /* 惊喜弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            animation: overlayIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: modalIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-emoji {
            font-size: 64px;
            margin-bottom: 20px;
            animation: modalEmoji 1s ease-in-out infinite;
        }

        @keyframes modalEmoji {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(5deg); }
        }

        .modal-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #f0c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* 底部签名 */
        .signature {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
                border-radius: 24px;
            }
            .title {
                font-size: 32px;
            }
            .message {
                font-size: 16px;
            }
            .highlight {
                font-size: 18px;
            }
            .encourage {
                font-size: 22px;
            }
            .button {
                padding: 14px 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 音乐控制 -->
    <button class="music-control" id="musicBtn" onclick="toggleMusic()">🎵</button>
    <audio id="bgMusic" loop>
        <source src="https://music.163.com/song/media/outer/url?id=1901371647.mp3" type="audio/mpeg">
        <source src="https://cdn.pixabay.com/audio/2022/10/18/audio_048e8a8e8e.mp3" type="audio/mpeg">
    </audio>

    <!-- 气球 -->
    <div class="balloon" style="background: linear-gradient(135deg, #ff6b9d, #ff8fab); left: 8%; top: 15%; animation-delay: 0s;"></div>
    <div class="balloon" style="background: linear-gradient(135deg, #ffd93d, #ffe066); left: 85%; top: 25%; animation-delay: 1.5s;"></div>
    <div class="balloon" style="background: linear-gradient(135deg, #6bcf7f, #8fd9a0); left: 12%; top: 65%; animation-delay: 3s;"></div>
    <div class="balloon" style="background: linear-gradient(135deg, #4d9fff, #7ab8ff); left: 88%; top: 55%; animation-delay: 2s;"></div>
    <div class="balloon" style="background: linear-gradient(135deg, #c084fc, #d8b4fe); left: 50%; top: 80%; animation-delay: 4s;"></div>

    <!-- 主要内容 -->
    <div class="container">
        <div class="decoration">
            <span>✨</span>
            <span>🌟</span>
            <span>✨</span>
        </div>

        <h1 class="title">致我亲爱的朋友</h1>
        <p class="subtitle">感 恩 有 你</p>
        <div class="divider"></div>

        <div class="message">
            <p>感谢你一直以来的<span class="highlight">陪伴与支持</span></p>
            <p>在我困难的时候，你总是第一个伸出援手</p>
            <p>在我迷茫的时候，你总是给我<span class="highlight">鼓励和方向</span></p>
            <p>因为有你，我的生活充满了<span class="highlight">阳光和温暖</span></p>

            <p class="encourage">加油！未来一定会更好！✨</p>
            <p class="belief">我相信你，就像你一直相信我一样 💪</p>
        </div>

        <button class="button" onclick="showSurprise()">点击有惊喜 🎁</button>

        <div class="signature">WITH LOVE & GRATITUDE</div>
    </div>

    <!-- 惊喜弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-emoji" id="modalEmoji">🌈</div>
            <div class="modal-text" id="modalText">你是最棒的！</div>
            <button class="modal-close" onclick="closeModal()">谢谢你 💖</button>
        </div>
    </div>

    <script>
        // 创建粒子
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle particle-glow';
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
                document.body.appendChild(particle);
            }
        }

        // 创建星星
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(star);
            }
        }

        // 创建彩带
        function createConfetti() {
            const colors = ['#ff6b9d', '#ffd93d', '#6bcf7f', '#4d9fff', '#f093fb', '#c084fc'];
            const shapes = ['confetti-round', 'confetti-square'];

            setInterval(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti ' + shapes[Math.floor(Math.random() * shapes.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 6 + 4) + 'px';
                confetti.style.height = (Math.random() * 6 + 4) + 'px';
                confetti.style.animationDuration = (Math.random() * 3 + 4) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 7000);
            }, 300);
        }

        // 音乐控制
        let isPlaying = false;
        let hasInteracted = false;
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');

        bgMusic.volume = 0.5;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.textContent = '🎵';
                musicBtn.classList.remove('playing');
            } else {
                bgMusic.play().catch(() => {});
                musicBtn.textContent = '🎶';
                musicBtn.classList.add('playing');
            }
            isPlaying = !isPlaying;
            hasInteracted = true;
        }

        // 首次点击页面自动播放音乐
        document.addEventListener('click', function autoPlay() {
            if (!hasInteracted && !isPlaying) {
                bgMusic.play().then(() => {
                    musicBtn.textContent = '🎶';
                    musicBtn.classList.add('playing');
                    isPlaying = true;
                    hasInteracted = true;
                }).catch(() => {});
            }
            document.removeEventListener('click', autoPlay);
        }, { once: true });

        // 惊喜弹窗
        const surprises = [
            { emoji: '🌈', text: '你是最棒的！' },
            { emoji: '💖', text: '永远支持你！' },
            { emoji: '🌞', text: '明天会更好！' },
            { emoji: '🙏', text: '感谢有你！' },
            { emoji: '🚀', text: '一起加油！' },
            { emoji: '🌸', text: '你值得一切美好！' },
            { emoji: '⭐', text: '你是最闪亮的星！' }
        ];

        function showSurprise() {
            const surprise = surprises[Math.floor(Math.random() * surprises.length)];
            document.getElementById('modalEmoji').textContent = surprise.emoji;
            document.getElementById('modalText').textContent = surprise.text;
            document.getElementById('modal').classList.add('show');

            // 爆发彩带
            const colors = ['#ff6b9d', '#ffd93d', '#6bcf7f', '#4d9fff', '#f093fb', '#c084fc'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti ' + (Math.random() > 0.5 ? 'confetti-round' : 'confetti-square');
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 8 + 4) + 'px';
                    confetti.style.height = (Math.random() * 8 + 4) + 'px';
                    confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        // 点击弹窗外部关闭
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // 初始化
        window.onload = function() {
            createParticles();
            createStars();
            createConfetti();
        };
    </script>
</body>
</html>
